name: Sync Hugging Face Space

on:
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "requirements.txt"
      - "knowledge/**"
      - "rag_artifacts/**"
      - "scripts/rag/chat_gemini.py"
      - "scripts/rag/chat_groq.py"
      - "scripts/rag/commands.py"
      - "scripts/rag/conversation.py"
      - "scripts/rag/fetch_context.py"
      - "scripts/rag/rate_limits.py"
      - ".github/workflows/sync-huggingface-space.yml"
  workflow_dispatch:

jobs:
  retrieval-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('rag_artifacts/manifest.json') }}
          restore-keys: |
            huggingface-${{ runner.os }}-

      - name: Install retrieval dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/rag/requirements-retrieval.txt

      - name: Build retrieval artifacts
        run: |
          python scripts/rag/build_index.py --out-dir /tmp/huggy-rag-artifacts

      - name: Evaluate retrieval quality
        run: |
          python scripts/rag/evaluate_retrieval.py --artifact-dir /tmp/huggy-rag-artifacts

  sync-space:
    runs-on: ubuntu-latest
    needs: retrieval-check

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_REPO" ]; then
            echo "HF_TOKEN and HF_SPACE_REPO secrets are required."
            exit 1
          fi

          python -m pip install --upgrade pip
          python -m pip install --upgrade "huggingface_hub[hf_xet]>=0.32.0"

          mkdir -p /tmp/huggy-space
          mkdir -p /tmp/huggy-space/rag
          rsync -a app.py requirements.txt knowledge rag_artifacts /tmp/huggy-space/
          rsync -a \
            scripts/rag/chat_gemini.py \
            scripts/rag/chat_groq.py \
            scripts/rag/commands.py \
            scripts/rag/conversation.py \
            scripts/rag/fetch_context.py \
            scripts/rag/rate_limits.py \
            /tmp/huggy-space/rag/

          find /tmp/huggy-space -maxdepth 3 -type f | sort
          test -f /tmp/huggy-space/rag/chat_gemini.py
          test -f /tmp/huggy-space/rag/chat_groq.py
          test -f /tmp/huggy-space/rag/fetch_context.py

          cd /tmp/huggy-space
          python - <<'PY'
          import sys
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root / "rag"))
          import chat_gemini  # noqa: F401
          import chat_groq  # noqa: F401
          import commands  # noqa: F401
          import conversation  # noqa: F401
          print("Space payload imports OK")
          PY
          python -m py_compile app.py rag/*.py

          cat > /tmp/huggy-space/README.md <<'EOF'
          ---
          title: Huggy
          emoji: 🤗
          colorFrom: blue
          colorTo: green
          sdk: gradio
          app_file: app.py
          pinned: false
          ---

          # Huggy

          Athulya's portfolio assistant.
          EOF

          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              folder_path="/tmp/huggy-space",
              repo_id=os.environ["HF_SPACE_REPO"],
              repo_type="space",
              commit_message="Sync Huggy Space",
              delete_patterns=[
                  ".github/**",
                  "assets/**",
                  "index.html",
                  "styles.css",
                  "CNAME",
                  "robots.txt",
                  "sitemap.xml",
                  "scripts/*.js",
                  "scripts/rag/**",
              ],
          )
          PY

name: Sync Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  retrieval-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('rag_artifacts/manifest.json') }}
          restore-keys: |
            huggingface-${{ runner.os }}-

      - name: Install retrieval dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/rag/requirements-retrieval.txt

      - name: Build retrieval artifacts
        run: |
          python scripts/rag/build_index.py --out-dir /tmp/huggy-rag-artifacts

      - name: Evaluate retrieval quality
        run: |
          python scripts/rag/evaluate_retrieval.py --artifact-dir /tmp/huggy-rag-artifacts

  sync-space:
    runs-on: ubuntu-latest
    needs: retrieval-check

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_REPO" ]; then
            echo "HF_TOKEN and HF_SPACE_REPO secrets are required."
            exit 1
          fi

          mkdir -p /tmp/huggy-space
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__pycache__' \
            ./ /tmp/huggy-space/

          cat > /tmp/huggy-space/README.md <<'EOF'
          ---
          title: Huggy
          emoji: 🤗
          colorFrom: blue
          colorTo: green
          sdk: gradio
          sdk_version: 5.0.0
          app_file: app.py
          pinned: false
          ---

          # Huggy

          Athulya's portfolio assistant.
          EOF

          cd /tmp/huggy-space
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Sync Huggy Space"
          git branch -M main
          git remote add huggingface "https://hf:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}"
          git push --force huggingface main

name: RAG Retrieval Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  retrieval-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('rag_artifacts/manifest.json') }}
          restore-keys: |
            huggingface-${{ runner.os }}-

      - name: Install retrieval dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/rag/requirements-retrieval.txt

      - name: Build retrieval artifacts
        run: |
          python scripts/rag/build_index.py --out-dir /tmp/huggy-rag-artifacts

      - name: Evaluate retrieval quality
        run: |
          python scripts/rag/evaluate_retrieval.py --artifact-dir /tmp/huggy-rag-artifacts
